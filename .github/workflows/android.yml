name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing GitHub Release tag to update with the newly signed APK (e.g. v1.2.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Decode release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/release.jks"
            echo "ANDROID_KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
            echo "Using persistent release signing keystore"
          else
            echo "No release keystore secret configured; falling back to debug signing"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean up temp keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/video-extractor-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-extractor-android-apk
          path: android/app/build/outputs/apk/release/video-extractor-android.apk

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$TARGET_TAG" \
            app/build/outputs/apk/release/video-extractor-android.apk --clobber
